<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Date | Arman & Monika</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        html, body { width: 100%; max-width: 100vw; overflow-x: hidden; background-color: #fff; color: #000; display: flex; flex-direction: column; align-items: center; }

        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffffff; z-index: 9999; display: flex; justify-content: center; align-items: center;
            transition: opacity 1.2s ease, visibility 1.2s ease;
        }
        #intro-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        
        .intro-box {
            width: 85%; max-width: 320px; height: 60vh; max-height: 420px;
            border-radius: 20px; position: relative; display: flex; flex-direction: column;
            justify-content: flex-end; align-items: center; padding: 25px 15px 35px 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); overflow: hidden;
            border: 2px solid #eaeaea; background-color: #ffffff;
        }
        
        .intro-hidden-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; z-index: 1; background: #fff;
        }
        .intro-save { font-family: 'Great Vibes', cursive; font-size: 3.2rem; margin-bottom: 8px; color: #000; }
        .intro-text { font-size: 0.9rem; line-height: 1.5; font-weight: 400; color: #444; }
        
        .intro-hint { 
            position: relative; z-index: 3; font-size: 0.75rem; font-weight: 700; 
            color: #555; margin-top: auto; letter-spacing: 1.2px; text-transform: uppercase;
        }

        #scratch-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 50px);
            z-index: 2; cursor: pointer; touch-action: none; border-radius: 20px 20px 0 0;
        }

        .fade-in { 
            opacity: 0; 
            transform: translateY(60px) scale(0.96); 
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1), transform 1.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .fade-in.visible { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
        }

        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 50px; padding: 25px 15px 90px 15px; box-sizing: border-box; }
       .hero-section { width: 100%; display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .hero-img { width: 100%; height: auto; object-fit: cover; display: block; border-radius: 20px; }
        
        .hero-overlay-text {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px 20px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 3; pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            overflow: hidden;
        }
        
        /* Ամսաթիվը գալիս է ձախից */
        .wedding-date-col {
            display: flex; flex-direction: column; align-items: flex-start;
            font-size: 2.2rem; font-weight: 800; color: #fff; line-height: 1.1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            opacity: 0; transform: translateX(-80px);
            transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
        }
        .wedding-date-col.animate { opacity: 1; transform: translateX(0); }

        /* Անունները գալիս են աջից */
        .couple-names-col {
            display: flex; flex-direction: column; align-items: flex-end; text-align: right;
            font-family: 'Great Vibes', cursive; font-size: 3rem; font-weight: 600; color: #fff;
            line-height: 1.05; text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            transform: rotate(-3deg) translateX(80px);
            opacity: 0;
            transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
        }
        .couple-names-col.animate { opacity: 1; transform: rotate(-3deg) translateX(0); }
        .name-sub { font-family: 'Great Vibes', cursive; font-size: 3rem; font-weight: 600; }
        .ampersand { font-size: 1.8rem; font-family: 'Montserrat', sans-serif; font-weight: 300; margin: 1px 0; }

        .music-wrapper {
            width: 100%; display: flex; justify-content: center; align-items: center; margin-top: -15px; z-index: 10;
        }
        .music-toggle-btn {
            background: #000; color: #fff; border: none; padding: 12px 28px;
            border-radius: 30px; font-size: 0.85rem; font-weight: 600; letter-spacing: 1.5px;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25); text-transform: uppercase;
        }

        .timer-grid { display: flex; justify-content: space-between; width: 100%; gap: 10px; }
        .timer-pill { flex: 1; height: 105px; border-radius: 45px; border: 2px solid #000; background-color: #fff; color: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .timer-pill.black { background-color: #000; color: #fff; }
        .timer-num { font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
        .timer-unit { font-size: 0.75rem; font-weight: 600; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }

        .calendar-section { text-align: center; width: 100%; }
        .month-title { font-family: 'Great Vibes', cursive; font-size: 4rem; font-weight: 600; margin-bottom: 20px; color: #000; }
        .calendar-days { display: flex; justify-content: center; align-items: center; gap: 16px; }
        .day-num { font-size: 1.8rem; color: #ccc; font-weight: 500; width: 42px; text-align: center; }
        .day-num.heart-day { position: relative; color: #fff; font-weight: 800; display: flex; justify-content: center; align-items: center; }
        .heart-svg { position: absolute; width: 66px; height: 66px; fill: #000; z-index: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
        .day-num.heart-day span { position: relative; z-index: 2; font-size: 1.5rem; }
    </style>
</head>
  <body>

    <div id="intro-screen">
        <div class="intro-box">
            <div class="intro-hidden-content">
                <h1 class="intro-save">Save the Date</h1>
                <p class="intro-text">Հրավիրում ենք ձեզ կիսելու մեզ հետ մեր կյանքի ամենասպասված ու գեղեցիկ օրը։</p>
            </div>
            <canvas id="scratch-canvas"></canvas>
            <div class="intro-hint">Մաքրեք արծաթագույն շերտը</div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="hero-section">
            <img src="Monika&Arman1.jpg" alt="Arman & Monika" class="hero-img">
            <div class="hero-overlay-text">
                <div class="wedding-date-col" id="date-col">
                    <span>22.08.26</span>
                </div>
                <div class="couple-names-col" id="names-col">
                    <span class="name-sub">Arman</span>
                    <span class="ampersand">&</span>
                    <span class="name-sub">Monika</span>
                </div>
            </div>
        </div>
        <div class="music-wrapper fade-in">
            <button id="music-toggle" class="music-toggle-btn">
                <svg id="music-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span id="music-text">Երաժշտություն</span>
            </button>
        </div>

        <div class="timer-grid fade-in">
            <div class="timer-pill">
                <div class="timer-num" id="days">00</div>
                <div class="timer-unit">օր</div>
            </div>
            <div class="timer-pill">
                <div class="timer-num" id="hours">00</div>
                <div class="timer-unit">ժամ</div>
            </div>
            <div class="timer-pill">
                <div class="timer-num" id="min">00</div>
                <div class="timer-unit">րոպե</div>
            </div>
            <div class="timer-pill black">
                <div class="timer-num" id="sec">00</div>
                <div class="timer-unit">վրկ</div>
            </div>
        </div>

        <div class="calendar-section fade-in">
            <div class="month-title">Օգոստոս</div>
            <div class="calendar-days">
                <div class="day-num">20</div>
                <div class="day-num">21</div>
                <div class="day-num heart-day">
                    <svg class="heart-svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    <span>22</span>
                </div>
                <div class="day-num">23</div>
                <div class="day-num">24</div>
            </div>
        </div>
        <div class="restaurant-section fade-in" style="width: 100%; background: #fff; border-radius: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;">
            <div style="font-family: 'Great Vibes', cursive; font-size: 3.5rem; font-weight: 600; margin-bottom: 5px;">Ռեստորան</div>
            <img src="restoran.jpg" alt="Շատո Ռեստորան" style="width: 100%; border-radius: 20px; object-fit: cover; display: block; box-shadow: 0 8px 25px rgba(0,0,0,0.1);">
            <div style="font-size: 1.5rem; font-weight: 800; margin-top: 8px;">Շատո Ռեստորան</div>
            <div style="font-size: 1.1rem; color: #444; font-weight: 600;">Բաբաջանյան 48/1</div>
            <div style="font-size: 1.3rem; font-weight: 800; color: #000; margin-top: 4px;">Ժամը՝ 17:00</div>
            
            <a href="https://maps.google.com/?q=Babajanyan+48/1,+Yerevan" target="_blank" style="display: inline-block; background-color: #000; color: #fff; padding: 16px 40px; border-radius: 35px; text-decoration: none; font-size: 0.85rem; font-weight: 700; letter-spacing: 2.5px; margin-top: 12px; text-transform: uppercase; box-shadow: 0 6px 18px rgba(0,0,0,0.2);">ՔԱՐՏԵԶ</a>
        </div>

        <div class="second-img-wrapper fade-in" style="width: 100%; text-align: center; display: flex; flex-direction: column; gap: 18px;">
            <div style="font-family: 'Great Vibes', cursive; font-size: 3.5rem;">Սպասում ենք ձեզ</div>
            <img src="Monika&Arman2.jpg" alt="Arman & Monika" style="width: 100%; border-radius: 20px; object-fit: cover; display: block; box-shadow: 0 8px 25px rgba(0,0,0,0.1);">
        </div>

        <div class="rsvp-section fade-in" style="width: 100%; text-align: center;">
            <div style="font-family: 'Great Vibes', cursive; font-size: 4rem; margin-bottom: 30px;">RSVP</div>
            <div class="rsvp-form" style="display: flex; flex-direction: column; gap: 25px; width: 100%;">
                <div style="position: relative; width: 100%;">
                    <input type="text" id="guest-fullname" placeholder="Անուն Ազգանուն" required style="width: 100%; border: none; border-bottom: 2px solid #555; padding: 15px 0; font-size: 1.1rem; outline: none; background: transparent; color: #000; text-align: center; font-weight: 600;">
                </div>
                <div style="position: relative; width: 100%;">
                    <input type="number" id="total-guests" placeholder="Հյուրերի քանակը" min="1" required style="width: 100%; border: none; border-bottom: 2px solid #555; padding: 15px 0; font-size: 1.1rem; outline: none; background: transparent; color: #000; text-align: center; font-weight: 600;">
                </div>
                <div style="position: relative; width: 100%;">
                    <select id="attendance-status" required style="width: 100%; border: none; border-bottom: 2px solid #555; padding: 15px 0; font-size: 1.1rem; outline: none; background: transparent; color: #222; text-align: center; appearance: none; cursor: pointer; font-weight: 600;">
                        <option value="" disabled selected>Կմասնակցե՞ք</option>
                        <option value="Այո, սիրով կգամ">Այո, սիրով կգամ</option>
                        <option value="Ցավոք, չեմ կարող">Ցավոք, չեմ կարող</option>
                    </select>
                </div>
                <div style="position: relative; width: 100%;">
                    <select id="invitation-side" required style="width: 100%; border: none; border-bottom: 2px solid #555; padding: 15px 0; font-size: 1.1rem; outline: none; background: transparent; color: #222; text-align: center; appearance: none; cursor: pointer; font-weight: 600;">
                        <option value="" disabled selected>Ո՞ւմ կողմից եք</option>
                        <option value="Հարսի կողմից">Հարսի կողմից</option>
                        <option value="Փեսայի կողմից">Փեսայի կողմից</option>
                        <option value="Զույգի ընկեր">Զույգի ընկեր</option>
                    </select>
                </div>
                <button type="button" onclick="sendWeddingRSVP()" style="background-color: #000; color: #fff; border: none; padding: 18px; font-size: 0.95rem; font-weight: 700; letter-spacing: 2.5px; cursor: pointer; margin-top: 10px; width: 100%; border-radius: 12px; text-transform: uppercase; box-shadow: 0 6px 20px rgba(0,0,0,0.25);">ՈՒՂԱՐԿԵԼ</button>
            </div>
        </div>
    </div>
    <script>
        const introScreen = document.getElementById('intro-screen');
        const dateCol = document.getElementById('date-col');
        const namesCol = document.getElementById('names-col');

        let isOpened = false;

        function openIntro() {
            if (isOpened) return;
            isOpened = true;
            introScreen.classList.add('hide');
            playAudio();
            setTimeout(() => {
                dateCol.classList.add('animate');
                namesCol.classList.add('animate');
            }, 300);
        }

        // Հաստատ 11 վայրկյանից անպայման բացվում է (անկախ քերելուց)
        setTimeout(openIntro, 11000);

        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');

        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const img = new Image();
            img.src = 'arcat.jpg';
            img.onload = () => {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
        }
        window.addEventListener('load', initCanvas);

        let isDrawing = false;

        function scratch(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI * 2, false);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', () => isDrawing = true);
        canvas.addEventListener('touchmove', scratch);
        window.addEventListener('touchend', () => isDrawing = false);

        const audioTrack = document.getElementById('bg-music');
        const audioBtn = document.getElementById('music-toggle');
        const audioIcon = document.getElementById('music-icon');
        const musicText = document.getElementById('music-text');

        const svgPlay = "M8 5v14l11-7z";
        const svgPause = "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

        function playAudio() {
            if (audioTrack) {
                audioTrack.play().then(() => {
                    audioIcon.innerHTML = `<path d="${svgPause}"/>`;
                    musicText.innerText = "Դադարեցնել";
                }).catch(err => console.log("Աուդիո նվագարկումը սահմանափակված է։"));
            }
        }

        audioBtn.addEventListener('click', () => {
            if (audioTrack.paused) {
                audioTrack.play();
                audioIcon.innerHTML = `<path d="${svgPause}"/>`;
                musicText.innerText = "Դադարեցնել";
            } else {
                audioTrack.pause();
                audioIcon.innerHTML = `<path d="${svgPlay}"/>`;
                musicText.innerText = "Երաժշտություն";
            }
        });

        const fadeElements = document.querySelectorAll('.fade-in');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        fadeElements.forEach(el => observer.observe(el));

        const targetDate = new Date('2026-08-22T17:00:00').getTime();

        setInterval(() => {
            const now = new Date().getTime();
            const timeDifference = targetDate - now;

            if (timeDifference > 0) {
                const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = days < 10 ? '0' + days : days;
                document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
                document.getElementById('min').innerText = minutes < 10 ? '0' + minutes : minutes;
                document.getElementById('sec').innerText = seconds < 10 ? '0' + seconds : seconds;
            }
        }, 1000);

        function sendWeddingRSVP() {
            const fullName = document.getElementById('guest-fullname').value.trim();
            const status = document.getElementById('attendance-status').value;
            const count = document.getElementById('total-guests').value.trim();
            const side = document.getElementById('invitation-side').value;

            if (!fullName || !status || !count || !side) {
                alert("Խնդրում ենք լրացնել բոլոր դաշտերը։");
                return;
            }

            const whatsappText = `💍 *RSVP ՀԱՍՏԱՏՈՒՄ*%0A%0A👤 *Անուն:* ${fullName}%0A✨ *Մասնակցություն:* ${status}%0A👥 *Քանակ:* ${count}%0A❤️ *Կողմը:* ${side}`;
            
            // Ուղարկվում է հենց 077509902 WhatsApp համարին
            window.open(`https://wa.me/37477509902?text=${whatsappText}`, '_blank');
        }
    </script>
</body>
</html>
